name: Deploy Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/deploy_agent.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: agent
        run: npm ci

      - name: Build
        working-directory: agent
        run: npm run build

      - name: Test
        working-directory: agent
        run: npm test

      - name: Deploy agent definition
        working-directory: agent
        run: npm run deploy
        env:
          AGENT_DEPLOY_ENDPOINT: ${{ secrets.AGENT_DEPLOY_ENDPOINT }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.AGENT_DEPLOY_TOKEN }}
